{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" /><title>{{ product.name }} · Product3D</title><link rel="stylesheet" href="{% static 'app.css' %}" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{% url 'seller_dashboard' %}"><span class="brand-mark small">P3D</span> Product3D</a><a href="{% url 'seller_dashboard' %}" class="button ghost">← Dashboard</a>
    </header>
    <main class="container viewer-page">
      <p class="eyebrow">3D PRODUCT VIEWER</p><h1>{{ product.name }}</h1><p class="muted">{{ product.description }}</p>
      <div id="viewer" class="viewer">
        <div class="viewer-loading">Loading 3D model…</div>
      </div>
      <p class="hint">Drag to rotate · Scroll to zoom · Right-click to pan</p>
    </main>
    <script type="module">
      import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js'
      import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js'
      import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js'
      const host = document.querySelector('#viewer')
      const scene = new THREE.Scene()
      scene.background = new THREE.Color(0xf2f5f9)
      const camera = new THREE.PerspectiveCamera(40, host.clientWidth / host.clientHeight, 0.1, 1000)
      camera.position.set(3, 2, 4)
      const renderer = new THREE.WebGLRenderer({ antialias: true })
      renderer.setSize(host.clientWidth, host.clientHeight)
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
      renderer.outputColorSpace = THREE.SRGBColorSpace
      host.innerHTML = ''
      host.appendChild(renderer.domElement)
      scene.add(new THREE.HemisphereLight(0xffffff, 0x68758a, 2))
      const light = new THREE.DirectionalLight(0xffffff, 2)
      light.position.set(4, 6, 5)
      scene.add(light)
      const controls = new OrbitControls(camera, renderer.domElement)
      controls.enableDamping = true
      new GLTFLoader().load(
        '{{ model_url|escapejs }}',
        (g) => {
          scene.add(g.scene)
          const box = new THREE.Box3().setFromObject(g.scene)
          const size = box.getSize(new THREE.Vector3())
          const center = box.getCenter(new THREE.Vector3())
          g.scene.position.sub(center)
          const max = Math.max(size.x, size.y, size.z)
          camera.position.set(max * 1.8, max * 1.2, max * 1.8)
          camera.near = max / 100
          camera.far = max * 100
          camera.updateProjectionMatrix()
          controls.target.set(0, 0, 0)
        },
        undefined,
        (e) => {
          host.innerHTML = '<p class="viewer-loading">Could not load the model. Check the GLB file.</p>'
          console.error(e)
        }
      )
      function animate() {
        requestAnimationFrame(animate)
        controls.update()
        renderer.render(scene, camera)
      }
      animate()
      addEventListener('resize', () => {
        camera.aspect = host.clientWidth / host.clientHeight
        camera.updateProjectionMatrix()
        renderer.setSize(host.clientWidth, host.clientHeight)
      })
    </script>
  </body>
</html>
